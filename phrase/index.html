<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111426">
  <title>日语 B1 词组关</title>
  <link rel="stylesheet" href="./course.css?v=26">
</head>
<body>
  <main class="app-shell">
    <section class="screen start-screen active" id="startScreen">
      <p class="eyebrow">JAPANESE B1 · PHRASE COURSE</p>
      <h1>旅行日语词组关</h1>
      <p class="start-copy">通过搭配、例句和场景选择，掌握酒店与机场中的常用表达。</p>
      <div class="lesson-picker" id="lessonPicker" aria-label="选择课次"></div>
      <button class="primary-button" id="startButton" type="button">开始学习</button>
    </section>

    <section class="screen lesson-screen" id="lessonScreen">
      <header class="lesson-header">
        <button class="settings-button" id="settingsButton" type="button" aria-label="注音设置" title="注音设置">⚙</button>
        <button class="progress-track" id="progressTrack" type="button" aria-label="打开题目跳转"><span class="progress-fill" id="progressFill"></span></button>
        <button class="icon-button" id="closeButton" type="button" aria-label="退出课程">×</button>
      </header>
      <div class="stage" id="stage"></div>
    </section>

    <section class="screen finish-screen" id="finishScreen">
      <div class="finish-badge">✓</div>
      <p class="eyebrow">PHRASE COURSE COMPLETE</p>
      <h2 id="finishTitle"></h2>
      <p id="finishCopy"></p>
      <button class="primary-button" id="restartButton" type="button">再练一次</button>
      <button class="secondary-button" id="backButton" type="button">返回课次</button>
    </section>
  </main>
  <div class="lookup-pop" id="lookupPop" role="status"></div>
  <div class="jump-overlay" id="jumpOverlay" hidden>
    <section class="jump-dialog" role="dialog" aria-modal="true" aria-labelledby="jumpTitle">
      <div class="jump-dialog-head"><h2 id="jumpTitle">跳转题目</h2><button class="jump-close" id="jumpClose" type="button" aria-label="关闭">×</button></div>
      <div class="jump-grid" id="jumpGrid"></div>
    </section>
  </div>
  <div class="pronunciation-overlay" id="pronunciationOverlay" hidden>
    <section class="pronunciation-dialog" role="dialog" aria-modal="true" aria-labelledby="pronunciationTitle">
      <div class="jump-dialog-head"><h2 id="pronunciationTitle">注音设置</h2><button class="jump-close" id="pronunciationClose" type="button" aria-label="关闭">×</button></div>
      <button class="pronunciation-option" type="button" data-pronunciation="kana"><strong>假名注音</strong><small>かな</small></button>
      <button class="pronunciation-option" type="button" data-pronunciation="romaji"><strong>罗马音注音</strong><small>romaji</small></button>
      <button class="pronunciation-option" type="button" data-pronunciation="off"><strong>关闭注音</strong><small>仅显示日文</small></button>
    </section>
  </div>
  <div class="confirm-overlay" id="oralSkipDialog" hidden>
    <section class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="oralSkipTitle">
      <h2 id="oralSkipTitle">将跳过本关所有口语题</h2>
      <p>之后仍可重新进入本课练习。</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="oralSkipCancel" type="button">取消</button>
        <button class="confirm-accept" id="oralSkipConfirm" type="button">确定</button>
      </div>
    </section>
  </div>
  <script src="./course.config.js?v=22"></script>
  <script src="./audio-map.js?v=17"></script>
  <script src="./course-engine.js?v=26"></script>
  <script src="./pronunciation-settings.js?v=1"></script>
</body>
</html>
