<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="个性化关、词组关和句子关的课程流程说明">
  <title>三个关卡 · 课程流</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-soft: #f0f2f5;
      --ink: #20242c;
      --muted: #747b88;
      --line: #dfe3e8;
      --accent: #252a34;
      --accent-ink: #ffffff;
      --blue: #5878e8;
      --green: #35a873;
      --red: #df5b62;
      --shadow: 0 14px 36px rgba(30, 37, 49, .09);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); }
    button, select { font: inherit; }
    button { color: inherit; }
    .app-header { position: sticky; top: 0; z-index: 10; padding: 16px clamp(16px, 4vw, 48px); background: rgba(245, 246, 248, .92); border-bottom: 1px solid var(--line); backdrop-filter: blur(18px); }
    .header-row { width: min(1180px, 100%); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .brand { display: flex; align-items: baseline; gap: 12px; }
    .brand h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.03em; }
    .brand span { color: var(--muted); font-size: 13px; }
    .view-tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-soft); }
    .view-tab { min-height: 38px; padding: 0 15px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; cursor: pointer; }
    .view-tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 56px; }
    .overview { display: grid; grid-template-columns: 1fr auto; gap: 22px; align-items: end; margin-bottom: 20px; }
    .overview h2 { margin: 0 0 7px; font-size: clamp(24px, 4vw, 38px); letter-spacing: -.04em; }
    .overview p { margin: 0; color: var(--muted); line-height: 1.7; }
    .stats { display: flex; gap: 10px; }
    .stat { min-width: 96px; padding: 12px 15px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
    .stat strong { display: block; font-size: 20px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .course-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .course-tab { min-height: 42px; padding: 0 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 750; cursor: pointer; }
    .course-tab[aria-selected="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
    .display-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; cursor: pointer; }
    .switch input { width: 40px; height: 22px; margin: 0; accent-color: var(--accent); }
    .filter-label { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .filter-label select { min-height: 40px; padding: 0 34px 0 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: var(--surface); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 420px); gap: 22px; align-items: start; }
    main.notes-visible .layout { grid-template-columns: 1fr; }
    main.notes-visible .detail-panel { display: none; }
    .flow-panel, .detail-panel, .global-panel { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .flow-panel { padding: clamp(18px, 3vw, 30px); }
    .flow-caption { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .flow-caption strong { font-size: 18px; }
    .flow-caption span { color: var(--muted); font-size: 13px; }
    .flow-start { width: min(100%, 560px); margin: 0 auto; color: var(--muted); text-align: center; font-size: 14px; font-weight: 750; }
    .flow-start::after { content: "↓"; display: block; margin: 8px 0; color: #aab4a6; font-size: 22px; font-weight: 400; }
    .phase { margin-bottom: 24px; padding: 20px clamp(14px, 2.5vw, 26px) 12px; border: 1px solid var(--line); border-radius: 16px; background: #fbfcfa; }
    .phase:last-child { margin-bottom: 0; }
    .phase-heading { margin: 0 0 5px; color: #566655; font-size: 16px; }
    .phase-note { margin: 0 0 15px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .nodes { display: grid; gap: 0; }
    .flow-row { position: relative; display: grid; grid-template-columns: minmax(260px, 560px); justify-content: center; gap: 28px; padding-bottom: 28px; }
    .flow-row:last-child { padding-bottom: 4px; }
    .flow-row:not(:last-child)::after { content: "↓"; position: absolute; left: 50%; bottom: 2px; color: #aab4a6; font-size: 20px; transform: translateX(-50%); }
    main.notes-visible .flow-row { grid-template-columns: minmax(260px, 48%) minmax(280px, 1fr); align-items: center; justify-content: stretch; }
    main.notes-visible .flow-row:not(:last-child)::after { left: 24%; }
    .node { position: relative; width: 100%; min-height: 68px; padding: 13px 18px; border: 1px solid #d7c49e; border-radius: 10px; text-align: center; background: #fff4df; cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
    .node[data-kind="intro"], .node[data-kind="finish"] { border-color: #a9c6dd; background: #e6f2fb; color: #2f5873; }
    .node[data-kind="follow"], .node[data-kind="oral"] { border-color: #c9b6dd; background: #f2eafb; color: #624f78; }
    .node[data-kind="listen"], .node[data-kind="fill"] { border-color: #b8d1c0; background: #eaf5ed; color: #43614b; }
    .node:hover { border-color: #aab2be; transform: translateY(-1px); }
    .node[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
    .node strong { display: block; font-size: 15px; }
    .standard-note { color: #70796d; font-size: 14px; line-height: 1.75; }
    .standard-note strong { color: #475047; }
    .detail-panel { position: sticky; top: 94px; padding: 22px; }
    .detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail-close { border: 0; background: transparent; color: var(--muted); cursor: pointer; }
    .detail-step { color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    .detail-panel h3 { margin: 5px 0 18px; font-size: 22px; }
    .detail-summary { margin: -8px 0 18px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .detail-list { display: grid; gap: 12px; margin: 0; }
    .detail-list div { padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    .detail-list dt { margin-bottom: 4px; font-size: 13px; font-weight: 800; }
    .detail-list dd { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .ui-flow { display: grid; justify-items: stretch; }
    .ui-step { min-height: 58px; display: grid; place-items: center; padding: 10px 14px; border: 1px solid var(--line); background: #fbfcfa; text-align: center; font-size: 14px; font-weight: 700; }
    .ui-arrow { padding: 5px 0; color: #aab4a6; text-align: center; }
    .ui-branch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .ui-branch div { padding: 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; text-align: center; }
    .ui-branch .success { background: #e8f5ed; color: #2f6848; }
    .ui-branch .retry { background: #fff0ef; color: #8a4748; }
    .detail-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
    .detail-nav button { min-height: 38px; border: 0; background: transparent; color: #66775f; cursor: pointer; }
    .branch { margin-top: 16px; padding: 14px; border-radius: 12px; background: #f0f3ff; color: #344b99; font-size: 14px; line-height: 1.6; }
    .branch strong { display: block; margin-bottom: 3px; }
    .global-panel { margin-top: 22px; padding: 22px; }
    .global-panel h3 { margin: 0 0 14px; font-size: 18px; }
    .global-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .global-item { padding-top: 12px; border-top: 2px solid var(--line); }
    .global-item strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .global-item span { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .empty { padding: 50px 20px; color: var(--muted); text-align: center; }
    @media (max-width: 820px) {
      .app-header { position: static; }
      .header-row, .overview { align-items: flex-start; }
      .header-row { flex-direction: column; }
      .overview { grid-template-columns: 1fr; }
      .stats { width: 100%; }
      .stat { flex: 1; }
      .layout { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
      .global-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 520px) {
      main { width: min(100% - 20px, 1180px); margin-top: 16px; }
      .app-header { padding: 13px 10px; }
      .brand { display: block; }
      .brand span { display: block; margin-top: 3px; }
      .view-tabs { width: 100%; }
      .view-tab { flex: 1; }
      .controls, .display-controls { align-items: stretch; }
      .course-tabs, .course-tab, .display-controls, .filter-label { width: 100%; }
      .course-tab { flex: 1; padding: 0 10px; }
      .filter-label { justify-content: space-between; }
      .filter-label select { flex: 1; }
      .flow-panel { padding: 17px 13px; }
      .flow-row, main.notes-visible .flow-row { grid-template-columns: 1fr; gap: 10px; }
      .flow-row:not(:last-child)::after, main.notes-visible .flow-row:not(:last-child)::after { left: 50%; }
      .standard-note { padding: 0 4px 12px; }
      .global-grid { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-row">
      <div class="brand"><h1>三个关卡</h1><span>课程流程说明</span></div>
      <nav class="view-tabs" aria-label="内容视图">
        <button class="view-tab" type="button" aria-selected="true">课程流</button>
        <button class="view-tab" type="button" aria-selected="false" id="compareButton">对比说明</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="overview">
      <div><h2 id="courseTitle">个性化关</h2><p id="courseSummary"></p></div>
      <div class="stats" aria-label="课程数据">
        <div class="stat"><strong id="stepCount">15</strong><span>固定步骤</span></div>
        <div class="stat"><strong id="phaseCount">3</strong><span>学习阶段</span></div>
      </div>
    </section>

    <section class="controls" aria-label="课程流控制">
      <div class="course-tabs" role="tablist" aria-label="关卡类型">
        <button class="course-tab" type="button" role="tab" aria-selected="true" data-course="personalized">个性化关</button>
        <button class="course-tab" type="button" role="tab" aria-selected="false" data-course="phrase">词组关</button>
        <button class="course-tab" type="button" role="tab" aria-selected="false" data-course="sentence">句子关</button>
      </div>
      <div class="display-controls">
        <label class="switch"><input id="notesToggle" type="checkbox">内容标准</label>
        <label class="filter-label">筛选阶段 <select id="phaseFilter" aria-label="筛选阶段"></select></label>
      </div>
    </section>

    <div class="layout">
      <section class="flow-panel" aria-labelledby="flowHeading">
        <div class="flow-caption"><strong id="flowHeading">课程流</strong><span>点击节点查看交互</span></div>
        <div id="flowContent"></div>
      </section>
      <aside class="detail-panel" id="detailPanel" aria-live="polite"></aside>
    </div>

    <section class="global-panel" aria-labelledby="globalHeading">
      <h3 id="globalHeading">全局交互</h3>
      <div class="global-grid" id="globalGrid"></div>
    </section>
  </main>

  <script>
    (() => {
      const shared = {
        pronunciation: ["注音", "假名、罗马音、关闭三种模式；覆盖汉字、纯假名、助词和活用部分。"],
        progress: ["进度与跳题", "顶部进度条显示当前位置；点击可打开数字跳题器并直达任一步。"],
        cleanup: ["状态清理", "切题、跳题、退出或重开会停止旧音频；离开口语题时终止旧识别回调。"]
      };
      const data = {
        personalized: {
          name: "个性化关", summary: "围绕三个主题词，完成“辨义—拼词—拼词组—统一句型—口语跟读”的 15 步递进训练。", steps: 15,
          phases: [
            { name: "阶段一 · 三个主题词", note: "每个词依次完成辨义、单词 Chunk 拼写和延伸词组 Chunk 拼写，共 9 步。", nodes: [
              ["P1", "词1 · 辨义", "新词保持日语原表记；干扰项不能与正确义相同或近义，可取多义词另一义、形近误解义。", "meaning"], ["P2", "词1 · 拼单词", "单词 Chunk 保持整体，不按假名单字或外来语音节拆；罗马音、展示假名和 TTS 文本逐行对应。", "spellWord"], ["P3", "词1 · 拼词组", "词组须自然；按词或语义单位拆，并把本课新词独立成块；Chunk 各列数量一致。", "spellPhrase"],
              ["P4", "词2 · 辨义", "新词保持日语原表记；连续相同单词的干扰项一致，且尽量避免全表重复。", "meaning"], ["P5", "词2 · 拼单词", "单词 Chunk 保持整体；展示假名按原表记，TTS 只在多音或易错读时做最小替换。", "spellWord"], ["P6", "词2 · 拼词组", "词组围绕当前新词生成；助词翻译要说明语境功能，Chunk 注音、翻译和 TTS 逐行对齐。", "spellPhrase"],
              ["P7", "词3 · 辨义", "中文释义准确，可用中文分号分隔多个义项；干扰项需有迷惑性但不能构成近义答案。", "meaning"], ["P8", "词3 · 拼单词", "不把新词拆碎；罗马音仅使用 Hepburn/旧表罗马音与 ASCII 标点，不混入假名或汉字。", "spellWord"], ["P9", "词3 · 拼词组", "词组 Chunk 必须完整拼回词组；新词独立，标点不遗漏，相关多行字段严格等行。", "spellPhrase"]
            ]},
            { name: "阶段二 · 统一句型", note: "按词3 → 词2 → 词1倒序完成三句，每句 4 个语义组。", nodes: [
              ["P10", "句子1 · 沼る", "典型句围绕当前词组自然成句；Chunk 按日语语序拆，助词尽量独立，标点独立。", "sentence"], ["P11", "句子2 · 無双", "同一 Lesson 的可替换句型外壳保持一致；用 ... 表示空位，不写功能说明或 xxx/～/~。", "sentence"], ["P12", "句子3 · キャリー", "单个典型句 Chunk 加权长度不超过 34；罗马音、假名、直译、自然译和 TTS 必须逐行对应。", "sentence"]
            ]},
            { name: "阶段三 · 口语输出", note: "跟读同三句；任一题均可把当前和剩余口语题切换为拼句。", nodes: [
              ["P13", "跟读1", "典型句 TTS 原文优先、最小替换；只在多音或易错读时改写读音。", "follow"], ["P14", "跟读2", "中文查词 Chunk 按中文显示顺序细拆，拼接后必须完整等于整句翻译；目标语严格来自原句。", "follow"], ["P15", "跟读3", "展示假名覆盖全部日文；助词保持原表记 は/へ/を，TTS 可读作 わ/え/を。", "follow"], ["完成", "完成关卡", "完成文案概括本课实际学习成果，不增加新的语料字段。", "finish"]
            ]}
          ],
          details: {
            meaning: ["辨义题", "通过图片、目标词和场景整句建立词义。", "自动播放 NPC 整句；用户从两个中文释义中选择。", "正确音、选项变绿并锁定，随后展示词义、讲解和继续按钮。", "错误音与红色回弹；不推进，可继续作答。", "以“日文词：中文义 + 词汇讲解”收束。"],
            spellWord: ["单词 Chunk 拼写", "建立目标词的字形、顺序和读音连接。", "常速/慢速播放；按顺序点击乱序 Chunk 填槽。", "Chunk 立即入槽并变绿，音频后台播放，不锁住下一次操作。", "所点 Chunk 播音并红色回弹；当前槽不推进。", "只展示完整目标词、常/慢速、可查词 Chunk 和继续按钮。"],
            spellPhrase: ["延伸词组 Chunk 拼写", "把核心词放进主题表达中。", "观看独立词组图，按顺序拼出完整词组。", "正确 Chunk 入槽；最后一块后串联播放完整词组。", "错误音和红色回弹，可立刻重试。", "完整词组、分块查词、常/慢速、词组讲解和继续按钮。"],
            sentence: ["统一句型题", "在同一四段句型中替换目标词组。", "中文语义块可查日语；每组从正确 Chunk 与干扰项中二选一。", "填绿当前槽并切到下一组；完成后播放 NPC 整句。", "播放所选项和错误音，红色回弹，不推进。", "完整原句、分块查词、常/慢速、语法讲解和继续按钮。"],
            follow: ["口语跟读题", "把完整句从“看懂”转成“能说”。", "播放目标句后录音；日语 ASR 计算匹配度，阈值 70，最长 15 秒。", "显示识别文本与分数；通过后约 850ms 自动进入下一题。", "显示识别文本、匹配度和重新朗读；权限或识别错误可重试。", "不保存录音；通过后自动推进。", "点击“现在不做口语题”后，当前与剩余口语题全部改为 Chunk 拼句；重新开始才恢复跟读。"],
            finish: ["完成关卡", "结束本轮 15 步。", "显示完成文案，可重新开始。", "—", "—", "重开后回到第 1 步，并恢复口语模式。"]
          },
          global: [shared.pronunciation, ["音频与查词", "常速/慢速；点击 Chunk 查中文并播放独立音频；反馈音与内容音轨分开。"], shared.progress, shared.cleanup]
        },
        phrase: {
          name: "词组关", summary: "每课围绕三个核心词，先学词义和两个搭配，再完成写句迁移与口语输出。", steps: 15,
          phases: [
            { name: "阶段一 · 词汇与搭配", note: "三个核心词，每个词先辨义，再学习两个搭配，共 9 步。", nodes: [
              ["P1", "核心词1", "新词保持日语原表记；释义准确；干扰项不可与正确义相同或近义。", "core"], ["P2", "搭配1-1", "搭配自然且围绕新词；按词或语义单位拆，并把新词独立成块。", "collocation"], ["P3", "搭配1-2", "Chunk 的罗马音、展示假名、中文义和 TTS 必须与日文逐行对应。", "collocation"],
              ["P4", "核心词2", "单词 Chunk 保持整体，不按假名单字或外来语音节拆；高风险读音才改 TTS。", "core"], ["P5", "搭配2-1", "助词可独立成块；中文解释需结合语境写明提示主题、对象、方向等功能。", "collocation"], ["P6", "搭配2-2", "多行 Chunk 字段数量一致；标点独立占行或在对应列使用标点站位。", "collocation"],

        document.querySelectorAll(".node").forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.step === state.selected));
          button.addEventListener("click", () => {
            selectNode(allNodes.find(node => node[0] === button.dataset.step));
          });
        });
        globalGrid.innerHTML = course.global.map(item => `<div class="global-item"><strong>${escapeHTML(item[0])}</strong><span>${escapeHTML(item[1])}</span></div>`).join("");
      }

      document.querySelectorAll("[data-course]").forEach(button => button.addEventListener("click", () => {
        state.course = button.dataset.course;
        state.phase = "all";
        state.selected = null;
        state.compare = false;
        document.querySelectorAll("[data-course]").forEach(item => item.setAttribute("aria-selected", String(item === button)));
        document.querySelectorAll(".view-tab").forEach((item, index) => item.setAttribute("aria-selected", String(index === 0)));
        render();
      }));
      notesToggle.addEventListener("change", () => { state.notes = notesToggle.checked; render(); });
      phaseFilter.addEventListener("change", () => { state.phase = phaseFilter.value; state.selected = null; render(); });
      document.querySelector(".view-tab").addEventListener("click", event => {
        state.compare = false;
        document.querySelectorAll(".view-tab").forEach(item => item.setAttribute("aria-selected", String(item === event.currentTarget)));
        render();
      });
      document.querySelector("#compareButton").addEventListener("click", event => {
        state.compare = true;
        document.querySelectorAll(".view-tab").forEach(item => item.setAttribute("aria-selected", String(item === event.currentTarget)));
        render();
      });
      render();
    })();
  </script>
</body>
</html>
