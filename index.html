<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日语 B1 旅行课程 Demo</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #26314d; background: #eef2f7; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 720px); }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 0; }
    p { margin: 0 0 28px; color: #68728c; line-height: 1.7; }
    nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    a { min-height: 132px; padding: 24px; border: 1px solid #d9e0ec; border-radius: 8px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 8px 26px rgba(37, 49, 80, .08); }
    strong, span { display: block; }
    strong { margin-bottom: 10px; font-size: 21px; }
    span { color: #77819a; font-size: 14px; line-height: 1.6; }
    @media (max-width: 560px) { nav { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>日语 B1 旅行课程 Demo</h1>
    <p>选择要体验的课程类型。</p>
    <nav>
      <a href="./phrase/"><strong>词组关</strong><span>搭配、场景造句与口语跟读</span></a>
      <a href="./sentence/"><strong>句子关</strong><span>语法分组、听力与完整句训练</span></a>
    </nav>
  </main>
</body>
</html>
