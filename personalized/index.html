<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111225">
  <title>个性化词组关</title>
  <link rel="stylesheet" href="./course.css?v=8">
</head>
<body>
  <main class="app-shell">
    <section class="screen start-screen active" id="startScreen"><p class="eyebrow" id="courseEyebrow"></p><h1 id="courseTitle"></h1><p id="courseDescription"></p><div class="lesson-tags" id="courseTags"></div><p class="unit-label">unit 1 · lesson order</p><div class="lesson-route" id="courseRoute" aria-label="关卡顺序"></div><button class="primary-button" id="startButton" type="button">开始挑战</button></section>
    <section class="screen lesson-screen" id="lessonScreen"><header class="lesson-header"><button class="settings-button" id="settingsButton" type="button" aria-label="注音设置" title="注音设置">⚙</button><button class="progress-track" id="progressTrack" type="button" aria-label="打开题目跳转"><span class="progress-fill" id="progressFill"></span></button><button class="icon-button" id="closeButton" type="button" aria-label="退出课程">×</button></header><div class="stage" id="stage"></div></section>
    <section class="screen finish-screen" id="finishScreen"><div class="finish-badge">✓</div><h2 id="finishTitle"></h2><p id="finishCopy"></p><button class="primary-button" id="restartButton" type="button">再练一次</button></section>
  </main>
  <div class="lookup-pop" id="lookupPop" role="status"></div>
  <div class="pronunciation-overlay" id="pronunciationOverlay" hidden><section class="pronunciation-dialog" role="dialog" aria-modal="true" aria-labelledby="pronunciationTitle"><div class="jump-dialog-head"><h2 id="pronunciationTitle">注音设置</h2><button class="jump-close" id="pronunciationClose" type="button" aria-label="关闭">×</button></div><button class="pronunciation-option" type="button" data-pronunciation="kana"><strong>假名注音</strong><small>かな</small></button><button class="pronunciation-option" type="button" data-pronunciation="romaji"><strong>罗马音注音</strong><small>romaji</small></button><button class="pronunciation-option" type="button" data-pronunciation="off"><strong>关闭注音</strong><small>仅显示日文</small></button></section></div>
  <div class="jump-overlay" id="jumpOverlay" hidden><section class="jump-dialog" role="dialog" aria-modal="true" aria-labelledby="jumpTitle"><div class="jump-dialog-head"><h2 id="jumpTitle">跳转题目</h2><button class="jump-close" id="jumpClose" type="button" aria-label="关闭">×</button></div><div class="jump-grid" id="jumpGrid"></div></section></div>
  <script src="./course.config.js?v=8"></script>
  <script src="./course-engine.js?v=8"></script>
  <script src="./pronunciation-settings.js?v=1"></script>
</body>
</html>
